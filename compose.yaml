services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-celebra}
      POSTGRES_USER: ${POSTGRES_USER:-celebra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-celebra_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-celebra} -d ${POSTGRES_DB:-celebra}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
